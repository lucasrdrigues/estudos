kind: Pod
apiVersion: v1
metadata:
  name: pod-secret-vol-env
spec:
  containers:
  - name: secret-vol-env
    image: nginx
    envFrom:
    - SecretRef:
        name: my-secret
        optional: true # Este secret e opcional, ou seja, o pod pode ser criado mesmo que o secret não exista
---
#  Para o secret ser opcional, devemos colocar a propriedade optional: true tanto no envFrom quanto no volume
kind: Pod
apiVersion: v1
metadata:
  name: pod-secret-vol-env-2
spec:
  containers:
  - name: secret-vol-env-2
    image: nginx
    envFrom:
    - SecretRef:
        name: my-secret
        optional: true
    volumeMounts:
    - name: my-vol
      mountPath: "/etc/secret-vol-env"
      readOnly: true
  # Definindo o volume para que possamos usar acima
  volumes:
  - name: my-vol
    secret:
      secretName: my-secret
      optional: true
